@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#000000; --wash:#141414; --ink:#FFFFFF; --grey:#A3A3A3; --rule:#2A2A2A; --card:#111111; --mark:rgba(255,255,255,.06); color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#000000; --wash:#141414; --ink:#FFFFFF; --grey:#A3A3A3; --rule:#2A2A2A; --card:#111111; --mark:rgba(255,255,255,.06); color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}
.mask{display:inline-block;background:var(--ink);-webkit-mask:var(--word) center/contain no-repeat;mask:var(--word) center/contain no-repeat}

.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;color:var(--grey)}
.brand .mask{width:150px;height:20px}
.brand span{padding-left:14px;border-left:1px solid var(--rule)}
.tabs{display:flex;gap:22px}
.tabs button{border:0;background:none;padding:6px 0;font-weight:700;font-size:15px;color:var(--grey);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.hero{position:relative;padding:64px 0 48px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px 48px;align-items:end;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;right:-140px;top:0;width:620px;height:480px;background:var(--mark);-webkit-mask:var(--wing) center/contain no-repeat;mask:var(--wing) center/contain no-repeat;pointer-events:none}
.week{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap}
.week span+span{font-weight:500;color:var(--grey)}
.hero h1{font-size:clamp(32px,5vw,56px);font-weight:900;line-height:1.15;letter-spacing:-.055em;max-width:15em}
.top3{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:10px;max-width:46em}
.top3 li{display:grid;grid-template-columns:22px 1fr;font-size:17px;line-height:1.55}
.top3 li::before{content:"";width:8px;height:8px;background:var(--ink);margin-top:.6em}
.issue{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--grey)}
.issue select{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}

/* category rail */
.rail{display:flex;gap:6px;flex-wrap:wrap;padding:18px 0 16px;border-top:1px solid var(--ink)}
.rail button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--grey);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.rail button:hover:not([disabled]){border-color:var(--ink);color:var(--ink)}
.rail button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rail button[disabled]{opacity:.35;cursor:default}
.rail .ctrl{margin-left:auto;display:flex;gap:6px}
.rail .ctrl button{width:36px;padding:7px 0;color:var(--ink);font-size:16px;line-height:1.2}

.track{display:grid;grid-auto-flow:column;grid-auto-columns:min(290px,78vw);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 0 18px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;min-height:340px;border:1px solid var(--rule);border-radius:14px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer;padding:22px;display:flex;flex-direction:column;position:relative;overflow:hidden;isolation:isolate;transition:border-color .15s}
.card:hover{border-color:var(--ink)}
.card.lead{background:var(--ink);color:var(--paper);border-color:var(--ink)}

          "스팀에서 AI 사용을 공시한 게임 비중은 2024년 약 12%에서 2026년 초 약 31%로 늘었습니다.",
          "사이게임즈(우마무스메)와 레벨파이브는 캐릭터·영상에 AI를 썼다가 팬 반발을 샀습니다."
        ],
        "so": "AI는 개발 효율에 쓰고, 이용자 눈에 보이는 아트·캐릭터에는 신중해야 합니다.",
        "sources": [
          {"t": "디지털데일리 – GDC 2026 조사", "u": "https://www.ddaily.co.kr/page/view/2026052221124155350"},
          {"t": "콘진원 – 글로벌 게임산업 트렌드", "u": "https://www.kocca.kr/global/2026_1+2/sub02_04.html"}
        ]
      }
    },
    {
      "cat": "행사·일정",
      "title": "지스타 오늘 개막, 무게는 AGF로",
      "stat": "11.19–22",
      "statLabel": "지스타 2026, 부산 벡스코",
      "summary": "국내 대형사는 12월 AGF에서 서브컬처 신작을 공개합니다.",
      "detail": {
        "lede": "지스타 2026이 부산 벡스코에서 개막했습니다. 제1전시장에 부스를 낸 국내 주요 게임사는 크래프톤과 웹젠뿐입니다.",
        "points": [
          "크래프톤은 신작 3종(타래: 언바운드, 에이지 트위스터, 왈츠앤잼)을 선보입니다.",
          "AGF 2026(12.4–6, 일산 킨텍스)에는 엔씨(메인 스폰서)·넥슨·스마일게이트가 서브컬처 신작을 냅니다."
        ],
        "so": "신작 첫 공개 무대가 해외 행사와 장르별 행사로 나뉘고 있습니다.",
        "sources": [
          {"t": "인사이트 – 지스타 배치도", "u": "https://www.insight.co.kr/news/575855"},
          {"t": "바이라인네트워크 – 지스타·AGF 출품작", "u": "https://byline.network/2026/11/3-472/"}
        ]
      }
    },
    {
      "cat": "투자·M&A",
      "title": "EA 산 사우디 자본, 유니티 인수 논의",
      "stat": "250억 달러",
      "statLabel": "유니티 인수 논의 가치 (보도 기준)",
      "summary": "EA를 비상장화한 컨소시엄이 게임 엔진사까지 노립니다.",
      "detail": {
        "lede": "사우디 국부펀드(PIF)와 실버레이크가 포함된 투자자 그룹이 유니티 인수를 논의했다고 로이터가 보도했습니다. 확정된 것은 아닙니다.",
        "points": [
          "같은 컨소시엄은 약 550억 달러에 EA를 인수해 8월 상장 폐지를 마쳤고, 이후 EA는 바이오웨어 스튜디오를 닫았습니다.",
          "성사되면 대형 퍼블리셔와 다수 모바일 게임이 쓰는 엔진을 같은 자본이 갖게 됩니다."
        ],
        "so": "유니티 엔진을 쓰는 회사라면 라이선스 정책 변화를 지켜봐야 합니다.",
        "sources": [
          {"t": "GodisaGeek – 유니티 인수 논의", "u": "https://godisageek.com/2026/11/unity-takeover-talks-silver-lake-pif/"},
          {"t": "MobileGamer.biz – 로이터 보도 정리", "u": "https://mobilegamer.biz/the-saudi-led-consortium-that-bought-ea-is-in-talks-to-acquire-unity-says-reuters/"}
        ]
      }
    }
  ],
  "calendar": [
    ["11.19", "GTA 6 출시, 지스타 개막"],
    ["11.26", "아주르 프로밀리아·템빨 출시"],
    ["12.3", "왈츠앤잼 글로벌 출시"],
    ["12.4", "AGF 2026 개막"],
    ["2.23", "페이블 출시 (2027)"]
  ],
  "note": "출시·행사 일정은 대작을 피해 잡고, 글로벌 IP와 PC 동시 출시 전략을 점검할 시점입니다."
}
]
</script>

<script>
(function(){
  var CATEGORIES = ['신작·출시','흥행·순위','국내 게임사','플랫폼·기기','트렌드','행사·일정','투자·M&A'];
  var ISSUES = [];
  try { ISSUES = JSON.parse(document.getElementById('issues').textContent); } catch(e) { ISSUES = []; }
  var cur = 0, open = -1, lastFocus = null;
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeUrl(u){ return /^https?:\/\//.test(u||'') ? u : '#'; }
  function figSize(t){ var n = String(t||'').length; return n >= 8 ? ' l' : (n >= 7 ? ' m' : ''); }
  function cards(){
    var is = ISSUES[cur]; if(!is) return [];
    return is.cards.slice().sort(function(a,b){
      var x = CATEGORIES.indexOf(a.cat), y = CATEGORIES.indexOf(b.cat);
      return (x < 0 ? 99 : x) - (y < 0 ? 99 : y);
    });
  }

  var sel = $('issue-select');
  ISSUES.forEach(function(is, i){
    var o = document.createElement('option');
    o.value = i; o.textContent = '제' + is.no + '호 (' + is.label + ')' + (i === 0 ? ' 최신' : '');
    sel.appendChild(o);
  });
  sel.addEventListener('change', function(){ cur = +sel.value; render(); });

  function render(){
    var is = ISSUES[cur]; if(!is) return;
    var cs = cards();
    $('h-week').textContent = '제' + is.no + '호 ' + is.label;
    $('h-range').textContent = is.range + ', ' + is.published.replace(/-/g,'.') + ' 발행';
    $('h-title').textContent = is.headline;
    $('h-top3').innerHTML = (is.top3||[]).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('');
    var present = cs.map(function(c){ return c.cat; });
    $('rail').innerHTML = CATEGORIES.map(function(cat){
      var k = present.indexOf(cat);
      return '<button data-k="' + k + '"' + (k < 0 ? ' disabled title="이번 주 소식 없음"' : '') + '>' + esc(cat) + '</button>';
    }).join('') + '<span class="ctrl"><button id="prev" aria-label="이전 카드">‹</button><button id="next" aria-label="다음 카드">›</button></span>';
    var track = $('track');
    track.innerHTML = cs.map(function(c, i){
      return '<button class="card' + (c.lead ? ' lead' : '') + '" style="animation-delay:' + (i*50) + 'ms" data-i="' + i + '" aria-label="' + esc(c.cat + ', ' + c.title) + ', 자세히 보기">' +
        '<span class="cat">' + esc(c.cat) + '</span><span class="open" aria-hidden="true">+</span>' +
        '<span class="fig' + figSize(c.stat) + '">' + esc(c.stat) + '</span><span class="figlab">' + esc(c.statLabel) + '</span>' +
        '<h3>' + esc(c.title) + '</h3><p>' + esc(c.summary) + '</p></button>';
    }).join('');
    track.classList.remove('dealt'); void track.offsetWidth; track.classList.add('dealt');
    track.scrollLeft = 0; mark();
    $('prev').onclick = function(){ track.scrollBy({left:-cardW(), behavior:'smooth'}); };
    $('next').onclick = function(){ track.scrollBy({left:cardW(), behavior:'smooth'}); };
    renderPaper(is, cs);
  }

  var track = $('track');
  function cardW(){ var c = track.querySelector('.card'); return c ? c.getBoundingClientRect().width + 12 : 290; }
  function idx(){ return Math.min(cards().length - 1, Math.round(track.scrollLeft / cardW())); }
  function mark(){
    var i = idx();
    Array.prototype.forEach.call($('rail').querySelectorAll('button[data-k]'), function(b){ b.classList.toggle('on', +b.dataset.k === i); });
  }
  track.addEventListener('scroll', function(){ requestAnimationFrame(mark); }, {passive:true});
  $('rail').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]'); if(!b || b.disabled) return;
    var k = +b.dataset.k, el = track.children[k];
    if(el) track.scrollTo({left: el.offsetLeft - track.offsetLeft, behavior:'smooth'});
  });
  track.addEventListener('click', function(e){ var b = e.target.closest('.card'); if(b) openDetail(+b.dataset.i); });

  function renderPaper(is, cs){
    var nums = cs.filter(function(c){ return /\d/.test(c.stat) && !/^\d{1,2}\.\d/.test(c.stat); }).slice(0,4);
    $('paper').innerHTML =
      '<div class="np-mast"><div><i class="by" role="img" aria-label="Risingwings"></i><div class="t">주간 게임 브리핑</div></div><div class="m"><strong>제' + is.no + '호, ' + esc(is.label) + '</strong>' + esc(is.range) + ', ' + esc(is.published.replace(/-/g,'.')) + ' 발행</div></div>' +
      '<div class="np-head"><h2>' + esc(is.headline) + '</h2><div><div class="lbl">한눈에 보는 이번 주</div><ul>' + (is.top3||[]).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div></div>' +
      '<div class="np-body"><div class="np-cats">' + cs.map(function(c){
        var d = c.detail || {};
        return '<article><div class="c">' + esc(c.cat) + '</div><h3>' + esc(c.title) + '</h3><p>' + esc(d.lede) + '</p>' + (d.so ? '<p class="s"><b>의미</b> ' + esc(d.so) + '</p>' : '') + '</article>';
      }).join('') + '</div><aside class="np-side">' +
        '<div><h4>숫자로 보는 이번 주</h4><div class="nums">' + nums.map(function(c){ return '<div><b>' + esc(c.stat) + '</b><span>' + esc(c.statLabel) + '</span></div>'; }).join('') + '</div></div>' +
        '<div><h4>다가오는 일정</h4><ul>' + (is.calendar||[]).map(function(x){ return '<li><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></li>'; }).join('') + '</ul></div>' +
        (is.note ? '<div><h4>시사점</h4><p class="note">' + esc(is.note) + '</p></div>' : '') +
      '</aside></div>' +
      '<div class="np-foot">출처: Newzoo, Alinea Analytics, 각 사 실적 발표와 국내외 보도. 기사별 출처는 카드뉴스의 각 카드에 있습니다.</div>';
  }

  function openDetail(i){
    var cs = cards(); if(i < 0 || i >= cs.length) return;
    if(open < 0) lastFocus = document.activeElement;
    open = i;
    var c = cs[i], d = c.detail || {};
    var tbl = d.table ? '<div class="tbl"><table><thead><tr>' + d.table.head.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      d.table.rows.map(function(r){ return '<tr>' + r.map(function(x){ return '<td>' + esc(x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' : '';
    $('d-body').innerHTML =
      '<div class="sheet-hero"><span class="cat">' + esc(c.cat) + '</span>' +
        '<div class="fig">' + esc(c.stat) + '</div><div class="figlab">' + esc(c.statLabel) + '</div>' +
        '<h2 id="d-title">' + esc(c.title) + '</h2></div>' +
      '<div class="sheet-body"><p class="lede">' + esc(d.lede) + '</p>' +
        (d.so ? '<p class="so"><b>우리에게 의미</b>' + esc(d.so) + '</p>' : '') + tbl +
        (d.points && d.points.length ? '<ul class="pts">' + d.points.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
        (d.sources && d.sources.length ? '<div class="src">출처<ul>' + d.sources.map(function(s){ return '<li><a href="' + esc(safeUrl(s.u)) + '" target="_blank" rel="noopener">' + esc(s.t) + '</a></li>'; }).join('') + '</ul></div>' : '') +
      '</div>';
    $('d-prev').disabled = i === 0; $('d-next').disabled = i === cs.length - 1;
    $('overlay').hidden = false; document.body.style.overflow = 'hidden'; $('overlay').scrollTop = 0; $('close').focus();
  }
  function closeDetail(){ $('overlay').hidden = true; document.body.style.overflow = ''; open = -1; if(lastFocus && lastFocus.focus) lastFocus.focus(); }
  $('close').addEventListener('click', closeDetail);
  $('overlay').addEventListener('click', function(e){ if(e.target === $('overlay')) closeDetail(); });
  $('d-prev').addEventListener('click', function(){ openDetail(open - 1); });
  $('d-next').addEventListener('click', function(){ openDetail(open + 1); });
  document.addEventListener('keydown', function(e){
    if(open < 0) return;
    if(e.key === 'Escape') closeDetail();
    else if(e.key === 'ArrowRight' && open < cards().length - 1) openDetail(open + 1);
    else if(e.key === 'ArrowLeft' && open > 0) openDetail(open - 1);
    else if(e.key === 'Tab'){
      var f = $('sheet').querySelectorAll('button:not([disabled]), a[href]'); if(!f.length) return;
      var first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  function show(view){
    var paper = view === 'paper';
    $('view-cards').hidden = paper; $('view-paper').hidden = !paper;
    $('tab-cards').setAttribute('aria-selected', String(!paper));
    $('tab-paper').setAttribute('aria-selected', String(paper));
  }
  $('tab-cards').addEventListener('click', function(){ location.hash = 'cards'; show('cards'); });
  $('tab-paper').addEventListener('click', function(){ location.hash = 'paper'; show('paper'); });
  window.addEventListener('hashchange', function(){ show(location.hash === '#paper' ? 'paper' : 'cards'); });

  render();
  show(location.hash === '#paper' ? 'paper' : 'cards');
})();
</script>
</body>
</html>
